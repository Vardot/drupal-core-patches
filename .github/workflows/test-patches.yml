name: Test patches

on:
  push:
    branches:
      - 11.4.x
  pull_request:
    branches:
      - 11.4.x
  schedule:
    # Weekly, so that a patch file disappearing upstream turns the branch red.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-files:
    name: Patch files exist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the canonical patches branch
        run: git fetch --depth=1 https://github.com/Vardot/drupal-core-patches.git patches:refs/remotes/upstream/patches

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Every patch URL resolves to a real patch file
        run: php tests/verify-patch-files.php upstream/patches

  apply-patches:
    name: Patches apply (composer-patches ${{ matrix.composer-patches }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composer-patches:
          - '~2.0'
          - '~1.7.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, dom, simplexml, tokenizer, curl, zip
          tools: composer:v2
          coverage: none

      - name: Detect declared patches
        id: patches
        run: |
          count=$(php -r '$d=json_decode(file_get_contents("composer.json"),true);echo count($d["extra"]["patches"]["drupal/core"]??[]);')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "This branch declares $count Drupal core patch(es)."

      - name: Create the test project
        if: steps.patches.outputs.count != '0'
        run: |
          mkdir -p tests/build
          cp tests/test.composer.json tests/build/composer.json

      - name: Pin cweagans/composer-patches ${{ matrix.composer-patches }}
        if: steps.patches.outputs.count != '0'
        run: composer --working-dir=tests/build --no-interaction --no-update require cweagans/composer-patches:"${{ matrix.composer-patches }}"

      - name: Cache Composer downloads
        if: steps.patches.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ github.ref_name }}-${{ matrix.composer-patches }}-${{ hashFiles('tests/test.composer.json') }}
          restore-keys: composer-${{ github.ref_name }}-

      - name: Install Drupal core and apply the patches
        if: steps.patches.outputs.count != '0'
        run: |
          set -o pipefail
          composer --working-dir=tests/build --no-interaction --no-progress --no-security-blocking install 2>&1 | tee tests/build/install.log

      - name: Every core patch was applied
        if: steps.patches.outputs.count != '0'
        run: php tests/verify-applied-patches.php tests/build tests/build/install.log

      - name: Upload the install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-composer-patches-${{ matrix.composer-patches }}
          path: tests/build/install.log
          if-no-files-found: ignore
